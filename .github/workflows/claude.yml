name: Claude Code
# Dünner Aufrufer — die Review-Logik liegt ZENTRAL in IURIX-GmbH/.github
# (.github/workflows/claude-review.yml). Diese Datei NICHT erweitern;
# Änderungen am Review immer im zentralen Repo.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: IURIX-GmbH/.github/.github/workflows/claude-review.yml@main
    secrets: inherit
