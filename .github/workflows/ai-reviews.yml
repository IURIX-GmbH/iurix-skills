# Dünner Aufrufer je Repo: .github/workflows/ai-reviews.yml
# Die Review-Logik liegt ZENTRAL in IURIX-GmbH/.github
# (.github/workflows/requesty-review.yml). Diese Datei NICHT erweitern;
# Änderungen am Review immer im zentralen Repo.
# Modellwahl: hier pro Job via policy/*-Alias (Requesty-Policy entscheidet
# die konkrete Modellversion — nie versionierte IDs pinnen).
name: AI Reviews (via Requesty)
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  gpt:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: IURIX-GmbH/.github/.github/workflows/requesty-review.yml@main
    with:
      model: policy/gpt
      mention: "@gpt review"
    secrets: inherit

  deepseek:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: IURIX-GmbH/.github/.github/workflows/requesty-review.yml@main
    with:
      model: policy/deepseek-latest-eu
      mention: "@deepseek review"
    secrets: inherit
