# Dünner Aufrufer je Repo: .github/workflows/ai-reviews.yml
# Die Review-Logik UND die Modellliste liegen ZENTRAL in IURIX-GmbH/.github
# (.github/workflows/ai-reviews.yml — GPT, Gemini, DeepSeek, GLM via Requesty).
# Diese Datei NICHT erweitern; Reviewer/Modelle immer im zentralen Repo ändern.
name: AI Reviews (via Requesty)
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  ai:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: IURIX-GmbH/.github/.github/workflows/ai-reviews.yml@main
    secrets: inherit
